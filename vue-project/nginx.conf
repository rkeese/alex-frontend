server {
    listen       80;
    server_name  localhost;

    # Auslieferung des Vue.js Frontends
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # WICHTIG: Leitet alle unbekannten Pfade auf die index.html um (für den Vue Router)
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy für die Go Backend API
    location /api/ {
        # 'api' sollte der Name deines Backend-Services in der docker-compose.yml sein
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}