server {
    listen       80;
    server_name  localhost;

    # Auslieferung des Vue.js Frontends
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # WICHTIG: Leitet alle unbekannten Pfade auf die index.html um (für den Vue Router)
        try_files $uri $uri/ /index.html;
    }

    # WICHTIG FÜR SPÄTER (Docker Compose):
    # Da deine App API-Anfragen an /api/v1/... sendet, kannst du diese hier 
    # direkt an deinen Go-Backend-Container weiterleiten lassen (Reverse Proxying).
    # Entferne die Rauten (#), sobald du Docker Compose mit dem Backend nutzt:
    #
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}